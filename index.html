<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>uma pesquisa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');

:root{
--bg:#f4f4f2;
--ink:#1f1f1d;
--muted:#8a8a86;
--accent:#2f2f2d;
--accent-soft:#d9d9d5;
--line:#e2e2de;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; width:100%; }

body{
font-family:'Inter',system-ui,sans-serif;
background:
radial-gradient(120% 80% at 50% -10%, #fbfbfa 0%, var(--bg) 55%, #ececea 100%);
color:var(--ink);
height:100dvh;
min-height:100dvh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
position:relative;
width:100%;
overscroll-behavior:none;
}

.stage{
width:100%;
max-width:460px;
text-align:center;
position:relative;
z-index:2;
}

.eyebrow{
font-size:.78rem;
letter-spacing:.28em;
text-transform:uppercase;
color:var(--muted);
margin-bottom:22px;
}

h1{
font-family:'Fraunces',serif;
font-weight:400;
line-height:1.08;
letter-spacing:-.02em;
}
h1 em{ font-style:italic; color:var(--accent); }

/* survey */
#survey{ animation:rise .7s ease; }
#survey.swap{ opacity:0; transform:translateY(10px); }
#survey{ transition:opacity .26s ease, transform .26s ease; }

#qTitle{
font-size:clamp(2rem,8vw,2.9rem);
margin-bottom:38px;
}

.options{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:center;
}
.btn-option{
font-family:'Inter',sans-serif;
font-size:1rem;
font-weight:500;
background:#fff;
color:var(--ink);
border:1px solid var(--line);
border-radius:100px;
padding:14px 24px;
cursor:pointer;
box-shadow:0 6px 18px -14px rgba(31,31,29,.5);
transition:transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
touch-action:manipulation;
}
.btn-option:hover{ transform:translateY(-2px); border-color:var(--accent-soft); }
.btn-option:active{ transform:translateY(0) scale(.98); }
.btn-option.chosen{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-option.is-custom{ font-style:italic; color:var(--muted); }

/* "outro" fill-in field */
.custom-wrap{ display:inline-flex; align-items:center; gap:8px; }
.custom-input{
font-family:'Inter',sans-serif;
font-size:1rem;
border:1px solid var(--accent-soft);
border-radius:100px;
padding:14px 20px;
width:190px;
max-width:56vw;
background:#fff;
color:var(--ink);
outline:none;
transition:border-color .2s ease;
}
.custom-input:focus{ border-color:var(--accent); }
.custom-go{
font-family:'Inter',sans-serif;
font-size:1.15rem;
font-weight:500;
background:var(--accent);
color:#fff;
border:none;
border-radius:100px;
width:48px;
height:48px;
cursor:pointer;
flex:none;
transition:transform .15s ease;
}
.custom-go:active{ transform:scale(.95); }

.progress{
margin-top:34px;
font-size:.72rem;
letter-spacing:.22em;
text-transform:uppercase;
color:var(--muted);
}

/* invite */
#ask .eyebrow{
opacity:0;
animation:rise .8s .1s ease forwards;
}
#inviteText{
font-size:clamp(1.55rem,6vw,2.2rem);
margin-bottom:40px;
opacity:0;
animation:rise .8s .22s ease forwards;
}

.buttons{
display:flex;
gap:14px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
opacity:0;
animation:rise .8s .38s ease forwards;
}

.btn{
font-family:'Inter',sans-serif;
font-size:1.05rem;
font-weight:500;
border:none;
cursor:pointer;
border-radius:100px;
padding:17px 34px;
transition:transform .18s ease, box-shadow .25s ease, background .35s ease, color .35s ease, border-color .35s ease;
touch-action:manipulation;
}

.btn-yes{
background:var(--accent);
color:#fff;
box-shadow:0 10px 26px -10px rgba(31,31,29,.5);
will-change:transform;
}
.btn-yes:hover{ transform:translateY(-2px); }
.btn-yes:active{ transform:translateY(0) scale(.98); }

.btn-no{
background:transparent;
color:var(--muted);
border:1px solid var(--line);
}
/* when it starts running it becomes free-floating */
.btn-no.loose{
position:fixed;
z-index:5;
margin:0;
white-space:nowrap;
}
/* when it gives up: back in the row, morphed into a yes */
.btn-no.gaveup{
position:static;
background:var(--accent);
color:#fff;
border-color:var(--accent);
box-shadow:0 10px 26px -10px rgba(31,31,29,.5);
}

/* confirmation */
.confirm{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:14px;
opacity:0;
pointer-events:none;
transform:translateY(8px);
}
.confirm.show{
opacity:1;
pointer-events:auto;
transform:translateY(0);
transition:opacity .6s ease .05s, transform .6s ease .05s;
}
.confirm .mark{
font-family:'Fraunces',serif;
font-style:italic;
font-size:clamp(2.2rem,9vw,3rem);
color:var(--accent);
}
.confirm .sub{
color:var(--muted);
font-size:1rem;
letter-spacing:.02em;
}
.confirm .wa{
margin-top:22px;
display:inline-flex;
align-items:center;
gap:9px;
font-size:.9rem;
font-weight:500;
letter-spacing:.01em;
color:var(--ink);
text-decoration:none;
background:#fff;
border:1px solid var(--line);
border-radius:100px;
padding:13px 24px 13px 20px;
box-shadow:0 8px 22px -14px rgba(31,31,29,.5);
transition:transform .18s ease, box-shadow .25s ease;
}
.confirm .wa:hover{ transform:translateY(-2px); box-shadow:0 12px 26px -14px rgba(31,31,29,.55); }
.confirm .wa:active{ transform:translateY(0) scale(.98); }
.confirm .wa svg{ width:17px; height:17px; flex:none; }

.signature{
margin-top:40px;
font-size:.8rem;
letter-spacing:.12em;
color:var(--muted);
opacity:0;
animation:rise .8s .55s ease forwards;
}

.hidden{ display:none !important; }

@keyframes rise{
from{ opacity:0; transform:translateY(14px); }
to{ opacity:1; transform:translateY(0); }
}

/* confetti hearts */
.heart{
position:fixed;
top:-24px;
font-size:16px;
pointer-events:none;
z-index:4;
will-change:transform,opacity;
}
@keyframes fall{
to{ transform:translateY(110vh) rotate(320deg); opacity:0; }
}

@media (prefers-reduced-motion:reduce){
*{ animation-duration:.001ms !important; }
.btn-no.loose{ transition:none; }
#survey{ transition:none; }
}
</style>
</head>
<body>
<div class="stage">

<!-- 3-question survey -->
<div id="survey">
<p class="eyebrow">pesquisa rápida 🍸</p>
<h1 id="qTitle"></h1>
<div class="options" id="qOptions"></div>
<p class="progress" id="qProgress"></p>
</div>

<!-- the invite, built from her answers -->
<div id="ask" class="hidden">
<p class="eyebrow">@isaprogin</p>
<h1 id="inviteText"></h1>
<div class="buttons">
<button class="btn btn-yes" id="yes">sim</button>
<button class="btn btn-no" id="no">não</button>
</div>
<p class="signature">@fe.varella</p>
</div>

<!-- confirmation -->
<div class="confirm" id="confirm">
<div class="mark">já to até com crise de ansiedade</div>
<div class="sub">date confirmado</div>
<a class="wa" id="waLink" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 1.67c2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.42 5.82c0 4.54-3.7 8.24-8.25 8.24a8.24 8.24 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24Zm-2.48 4.4c-.15 0-.4.06-.6.28-.2.22-.79.77-.79 1.87s.81 2.17.92 2.32c.11.15 1.57 2.4 3.8 3.36.53.23.95.37 1.27.47.53.17 1.02.14 1.4.09.43-.06 1.32-.54 1.5-1.06.19-.52.19-.97.13-1.06-.06-.09-.2-.15-.42-.26-.22-.11-1.32-.65-1.53-.72-.2-.08-.35-.11-.5.11-.15.22-.57.72-.7.87-.13.15-.26.17-.48.06-.22-.11-.94-.35-1.79-1.11-.66-.59-1.11-1.32-1.24-1.54-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.21-.68-1.66-.18-.43-.37-.37-.5-.38h-.42Z"/></svg>abrir no whatsapp</a>
</div>

</div>

<script>
(function(){
const PHONE = "5511991897898";

// ---------- survey ----------
const survey   = document.getElementById('survey');
const qTitle   = document.getElementById('qTitle');
const qOptions = document.getElementById('qOptions');
const qProgress= document.getElementById('qProgress');

const QUESTIONS = [
{ key:'drink', title:'qual seu drink favorito?',
  customPlaceholder:'seu drink...',
  buildCustom:function(v){ return v; },
  options:[
  {label:'Negroni',       phrase:'um Negroni'},
  {label:'Aperol Spritz', phrase:'um Aperol Spritz'},
  {label:'Gin tônica',    phrase:'uma gin tônica'},
  {label:'Caipirinha',    phrase:'uma caipirinha'},
  {label:'Margarita',     phrase:'uma margarita'},
  {label:'Outro', custom:true}
]},
{ key:'bar', title:'qual desses bares você prefere?',
  customPlaceholder:'qual bar?',
  buildCustom:function(v){ return 'no ' + v; },
  options:[
  {label:'Mercearia',        phrase:'no Mercearia'},
  {label:'Domo Bar',         phrase:'no Domo Bar'},
  {label:'Fel',              phrase:'no Fel'},
  {label:'Lágrima Bar',      phrase:'no Lágrima Bar'},
  {label:'Coda Bar',         phrase:'no Coda Bar'},
  {label:'Cascasse Il Mondo',phrase:'no Cascasse Il Mondo'},
  {label:'Outro', custom:true}
]},
{ key:'dia', title:'que dia você gosta de sair no fds?',
  options:[
  {label:'Sexta',     phrase:'numa sexta'},
  {label:'Sábado',    phrase:'num sábado'},
  {label:'Domingo',   phrase:'num domingo'},
  {label:'Tanto faz 🙂', phrase:'no dia que rolar', flexible:true}
]}
];

const answers = {};
let current = 0;

function renderQuestion(i){
const q = QUESTIONS[i];
qTitle.textContent = q.title;
qProgress.textContent = (i+1) + ' de ' + QUESTIONS.length;
qOptions.innerHTML = '';
q.options.forEach(function(opt){
const b = document.createElement('button');
b.className = 'btn-option';
b.textContent = opt.label;
if(opt.custom) b.classList.add('is-custom');
b.addEventListener('click', function(){
if(opt.custom){ openCustom(i, b); return; }
b.classList.add('chosen');
selectOption(i, opt);
});
qOptions.appendChild(b);
});
}

// she picked "outro" — swap that pill for a little text field
function openCustom(i, btn){
if(answers.__locked) return;
const q = QUESTIONS[i];
const wrap = document.createElement('span');
wrap.className = 'custom-wrap';
const input = document.createElement('input');
input.className = 'custom-input';
input.type = 'text';
input.setAttribute('autocomplete','off');
input.placeholder = q.customPlaceholder || 'escreva aqui';
input.maxLength = 40;
const go = document.createElement('button');
go.className = 'custom-go';
go.setAttribute('aria-label','confirmar');
go.textContent = '→';
wrap.appendChild(input);
wrap.appendChild(go);
qOptions.replaceChild(wrap, btn);
input.focus();
function submit(){
const v = input.value.trim();
if(!v){ input.focus(); return; }
selectOption(i, { label:v, phrase:q.buildCustom(v) });
}
go.addEventListener('click', submit);
input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
}

function selectOption(i, opt){
if(answers.__locked) return;
answers.__locked = true;
answers[QUESTIONS[i].key] = opt;
// let her see it register, then fade to the next step
setTimeout(function(){
survey.classList.add('swap');
setTimeout(function(){
current++;
answers.__locked = false;
if(current < QUESTIONS.length){
renderQuestion(current);
survey.classList.remove('swap');
} else {
finishSurvey();
}
}, 260);
}, 230);
}

function finishSurvey(){
const d = answers.drink, b = answers.bar, dia = answers.dia;
let invite, waText;
if(dia.flexible){
// no specific day: end the question at the bar, leave the day open
invite = 'topa então tomar <em>' + d.phrase + ' ' + b.phrase + '</em> ' +
'(mas pode ser outro lugar também)? <em>o dia a gente combina</em> 🙂';
waText = 'aceito! ' + d.phrase + ' tá perfeito, o dia a gente combina — quando você pode?';
} else {
invite = 'topa então tomar <em>' + d.phrase + ' ' + b.phrase + '</em> ' +
'(mas pode ser outro lugar também), <em>' + dia.phrase + '</em>?';
waText = 'aceito! ' + d.phrase + ' ' + dia.phrase + ' tá perfeito, quando e onde?';
}
inviteText.innerHTML = invite;
waLink.href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(waText);

survey.classList.add('hidden');
ask.classList.remove('hidden');
}

// ---------- invite + fleeing "não" ----------
const ask        = document.getElementById('ask');
const inviteText = document.getElementById('inviteText');
const yes        = document.getElementById('yes');
const no         = document.getElementById('no');
const buttons    = ask.querySelector('.buttons');
const confirm    = document.getElementById('confirm');
const waLink     = document.getElementById('waLink');

const phrases = ["tem certeza?","pensa melhor","opção inválida","tenta de novo","não aceito essa resposta","última chance 👀"];
let idx = 0, yesScale = 1, loose = false;

function vw(){ return (window.visualViewport && window.visualViewport.width)  || window.innerWidth; }
function vh(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }

function moveNo(e){
if(!loose){
no.classList.add('loose');
// escape .buttons: its leftover animation transform would make position:fixed
// relative to it (not the viewport) and throw the button off-screen
document.body.appendChild(no);
loose = true;
}
// set the phrase first, then measure the new size
no.textContent = phrases[idx % phrases.length];
idx++;
const pad = 14;
const w = no.offsetWidth, h = no.offsetHeight;
const W = vw(), H = vh();

// current center of the button
const rect = no.getBoundingClientRect();
let cx = rect.left + w/2, cy = rect.top + h/2;
if(!isFinite(cx) || rect.width === 0){ cx = W/2; cy = H*0.62; }

// the point to run away from: the finger/cursor if we have it
let px = cx, py = cy;
if(e){
const t = e.touches && e.touches[0];
if(t){ px = t.clientX; py = t.clientY; }
else if(e.clientX != null){ px = e.clientX; py = e.clientY; }
}

// direction away from the finger; if it's dead-center, pick a random angle
let dx = cx - px, dy = cy - py;
let dist = Math.hypot(dx, dy);
if(dist < 1){ const a = Math.random()*Math.PI*2; dx = Math.cos(a); dy = Math.sin(a); dist = 1; }

// hop a short, readable distance and stay on screen
const hop = Math.min(150, Math.max(90, Math.min(W, H) * 0.4));
let x = cx + (dx/dist)*hop - w/2;
let y = cy + (dy/dist)*hop - h/2;
x = Math.max(pad, Math.min(x, W - w - pad));
y = Math.max(pad, Math.min(y, H - h - pad));
no.style.left = x + 'px';
no.style.top = y + 'px';

yesScale = Math.min(yesScale + 0.06, 1.6);
yes.style.transform = 'scale(' + yesScale + ')';
}

// after all phrases have been shown once, the button gives up and becomes a "sim"
function surrender(){
no.removeEventListener('pointerenter', flee);
no.removeEventListener('pointerdown', flee);
no.removeEventListener('touchstart', flee);
no.classList.remove('loose');
no.classList.add('gaveup');
no.style.left = '';
no.style.top = '';
no.textContent = 'sim';
buttons.appendChild(no); // back into the row, next to the real yes
yesScale = 1;
yes.style.transform = ''; // both buttons the same size again
no.addEventListener('click', accept);
}

function flee(e){
if(e && e.cancelable) e.preventDefault();
if(idx >= phrases.length){ surrender(); return; }
moveNo(e);
}

// pointer events cover mouse hover + touch/pen on modern browsers
no.addEventListener('pointerenter', flee);
no.addEventListener('pointerdown', flee);
// fallback for older mobile safari that fires touch before pointer
no.addEventListener('touchstart', flee, {passive:false});

// keep it inside if the viewport resizes / rotates
function clampNo(){
if(!loose) return;
const pad = 14, w = no.offsetWidth, h = no.offsetHeight;
const x = Math.min(parseFloat(no.style.left)||0, vw() - w - pad);
const y = Math.min(parseFloat(no.style.top)||0, vh() - h - pad);
no.style.left = Math.max(pad, x) + 'px';
no.style.top = Math.max(pad, y) + 'px';
}
window.addEventListener('resize', clampNo);
if(window.visualViewport) window.visualViewport.addEventListener('resize', clampNo);

function hearts(){
for(let i=0;i<14;i++){
const s = document.createElement('span');
s.className = 'heart';
s.textContent = '·';
s.style.left = Math.random()*100 + 'vw';
s.style.color = Math.random() > .5 ? '#8a8a86' : '#c9c9c4';
s.style.fontSize = (14 + Math.random()*16) + 'px';
const dur = 2.6 + Math.random()*1.8;
s.style.animation = 'fall ' + dur + 's linear ' + (Math.random()*0.5) + 's forwards';
document.body.appendChild(s);
setTimeout(function(){ s.remove(); }, (dur+1)*1000);
}
}

function accept(){
ask.classList.add('hidden');
if(no.classList.contains('loose')) no.remove();
confirm.classList.add('show');
hearts();
// no auto-redirect: she taps "abrir no whatsapp" herself (reliable on iOS)
}

yes.addEventListener('click', accept);

// start
renderQuestion(0);
})();
</script>
</body>
</html>
